[build-system]
requires = [
  "setuptools == 83.0.0",
  "setuptools_scm[toml] == 10.2.1",
  "frequenz-repo-config[lib] == 0.18.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "frequenz-gridpool"
description = "High-level interface to grid pools for the Frequenz platform."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["frequenz", "python", "lib", "library", "gridpool"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
requires-python = ">= 3.11, < 4"
dependencies = [
  # Used transitively via marshmallow-dataclass (every config schema is a
  # `marshmallow.Schema`); declared directly so `pytest_min` pins its lower
  # bound and the minimum-version path is actually tested.
  "marshmallow >= 3.18.0, < 5",
  "marshmallow-dataclass >= 8.7.1, < 9",
  "typing-extensions >= 4.14.1, < 5",
  "frequenz-microgrid-component-graph >= 0.5.0, < 0.6",
  "frequenz-client-assets >= 0.5.0, < 0.6",
]
dynamic = ["version"]

[project.scripts]
gridpool-cli = "frequenz.gridpool.cli.__main__:main"

[[project.authors]]
name = "Frequenz Energy-as-a-Service GmbH"
email = "floss@frequenz.com"

[project.optional-dependencies]
cli = [
  "asyncclick >= 8.3.0.4, < 9",
  "tomlkit >= 0.13.0, < 1",
]
render-graph = [
  "frequenz-gridpool[cli]",
  "matplotlib >= 3.7.0, < 4",
  "networkx >= 3.0, < 4",
]

dev-flake8 = [
  "flake8 == 7.3.0",
  "flake8-datetimez == 20.10.0",
  "flake8-docstrings == 1.7.0",
  "flake8-pyproject == 1.2.4",  # For reading the flake8 config from pyproject.toml
  "pydoclint == 0.9.1",
  "pydocstyle == 6.3.0",
]
dev-formatting = ["black == 26.5.1", "isort == 8.0.1"]
dev-mkdocs = [
  "Markdown == 3.10.2",
  "black == 26.5.1",
  "mike == 2.2.0",
  "mkdocs-gen-files == 0.6.1",
  "mkdocs-literate-nav == 0.6.3",
  "mkdocs-macros-plugin == 1.5.0",
  "mkdocs-material == 9.7.7",
  "mkdocstrings[python] == 1.0.6",
  "mkdocstrings-python == 2.0.5",
  "frequenz-repo-config[lib] == 0.18.0",
]
dev-mypy = [
  "mypy == 2.3.0",
  "types-networkx>=3.6.1.20251220",
  "types-Markdown == 3.10.2.20260712",
  # For checking the noxfile, docs/ script, and tests
  "frequenz-gridpool[dev-mkdocs,dev-noxfile,dev-pytest]",
]
dev-noxfile = [
  "nox == 2026.7.11",
  "frequenz-repo-config[lib] == 0.18.0",
]
dev-pylint = [
  # dev-pytest already defines a dependency to pylint because of the examples
  # For checking the noxfile, docs/ script, and tests
  "frequenz-gridpool[dev-mkdocs,dev-noxfile,dev-pytest]",
]
dev-pytest = [
  "pytest == 9.1.1",
  "pylint == 4.0.6",       # We need this to check for the examples
  "frequenz-repo-config[extra-lint-examples] == 0.18.0",
  "pytest-mock == 3.15.1",
  "pytest-asyncio == 1.4.0",
  "async-solipsism == 0.9",
  # The tests cover the cli package and the graph renderer.  render-graph
  # already pulls in cli.
  "frequenz-gridpool[render-graph]",
]
dev = [
  "frequenz-gridpool[dev-mkdocs,dev-flake8,dev-formatting,dev-mkdocs,dev-mypy,dev-noxfile,dev-pylint,dev-pytest,render-graph]",
]

[project.urls]
Documentation = "https://frequenz-floss.github.io/frequenz-gridpool-python/"
Changelog = "https://github.com/frequenz-floss/frequenz-gridpool-python/releases"
Issues = "https://github.com/frequenz-floss/frequenz-gridpool-python/issues"
Repository = "https://github.com/frequenz-floss/frequenz-gridpool-python"
Support = "https://github.com/frequenz-floss/frequenz-gridpool-python/discussions/categories/support"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88
src_paths = ["benchmarks", "examples", "src", "tests"]

[tool.flake8]
# We give some flexibility to go over 88, there are cases like long URLs or
# code in documenation that have extra indentation. Black will still take care
# of making everything that can be 88 wide, 88 wide.
max-line-length = 100
extend-ignore = [
  "E203", # Whitespace before ':' (conflicts with black)
  "W503", # Line break before binary operator (conflicts with black)
]
# pydoclint options
style = "google"
check-return-types = false
check-yield-types = false
arg-type-hints-in-docstring = false
arg-type-hints-in-signature = true
allow-init-docstring = true
check-class-attributes = false

[tool.pylint.similarities]
ignore-comments = ['yes']
ignore-docstrings = ['yes']
ignore-imports = ['no']
min-similarity-lines = 40

[tool.pylint.messages_control]
disable = [
  "too-few-public-methods",
  "too-many-return-statements",
  "too-many-arguments",
  # disabled because it conflicts with isort
  "wrong-import-order",
  "ungrouped-imports",
  # Checked by mypy (and pylint is very flaky checking these)
  "unsubscriptable-object",
  "no-member",
  "no-name-in-module",
  "possibly-used-before-assignment",
  # Checked by flake8
  "f-string-without-interpolation",
  "line-too-long",
  "missing-function-docstring",
  "redefined-outer-name",
  "unnecessary-lambda-assignment",
  "unused-import",
  "unused-variable",
]

[tool.pytest.ini_options]
addopts = "-W=all -Werror -Wdefault::DeprecationWarning -Wdefault::PendingDeprecationWarning -vv"
testpaths = ["tests", "src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
required_plugins = ["pytest-asyncio", "pytest-mock"]

[tool.mypy]
explicit_package_bases = true
namespace_packages = true
# This option disables mypy cache, and it is sometimes useful to enable it if
# you are getting weird intermittent error, or error in the CI but not locally
# (or vice versa). In particular errors saying that type: ignore is not
# used but getting the original ignored error when removing the type: ignore.
# See for example: https://github.com/python/mypy/issues/2960
#no_incremental = true
packages = ["frequenz.gridpool"]
strict = true

[[tool.mypy.overrides]]
module = ["mkdocs_macros.*", "sybil", "sybil.*"]
ignore_missing_imports = true

[tool.setuptools_scm]
version_scheme = "post-release"
